<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBA新商品特典プログラム（2026）</title>
<style>
/* ── Reset & Base ───────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans JP","Noto Sans SC","Noto Sans",Arial,sans-serif;color:#111;background:#fff;font-size:15px;line-height:1.7}
a{color:inherit;text-decoration:none}
/* ── Tokens (matches sell.amazon.co.jp palette) ─────────────────── */
:root{
  --squid-ink:#232F3E;
  --squid-dark:#131A22;
  --storm:#444;
  --granite:#666;
  --cumulus:#aaa;
  --horizon:#f3f3f3;
  --aqua:#00a8cc;
  --orange:#FF9900;
  --orange-dark:#e47911;
  --green:#067D62;
  --white:#fff;
  --max-w:1200px;
}
/* ── Lang toggle bar ────────────────────────────────────────────── */
.lang-bar{background:var(--squid-dark);padding:8px 40px;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.lang-btn{background:transparent;border:1px solid #555;color:#ccc;padding:4px 14px;border-radius:3px;font-size:12px;cursor:pointer;transition:all .15s}
.lang-btn.active{background:var(--orange);color:#111;border-color:var(--orange);font-weight:700}
.lang-btn:hover:not(.active){border-color:#aaa;color:#fff}
/* ── SWB banner ─────────────────────────────────────────────────── */
.swb{background:#49850F;padding:8px 40px;display:flex;align-items:center;justify-content:space-between}
.swb-text{color:#fff;font-size:13px;font-weight:600}
.swb-link{color:#fff;text-decoration:underline;font-size:13px}
/* ── Nav ────────────────────────────────────────────────────────── */
nav{background:var(--squid-ink);padding:0 40px;height:54px;display:flex;align-items:center;justify-content:space-between}
.nav-logo img{height:28px}
.nav-logo-text{color:#fff;font-size:20px;font-weight:700;letter-spacing:-.5px}
.nav-logo-text span{color:var(--orange)}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{color:#ddd;font-size:13px;font-weight:400}
.nav-links a:hover{color:#fff}
.nav-cta{background:transparent;border:1px solid #888;color:#fff;padding:5px 16px;border-radius:3px;font-size:13px;cursor:pointer}
/* ── Breadcrumb ─────────────────────────────────────────────────── */
.breadcrumb{background:var(--squid-ink);padding:10px 40px;border-top:1px solid #3a4a5a}
.breadcrumb span{color:#8a9ab0;font-size:12px}
.breadcrumb span a{color:var(--aqua)}
.breadcrumb span .sep{margin:0 6px;color:#556}
/* ── Hero ────────────────────────────────────────────────────────── */
.hero{background:var(--squid-ink);padding:56px 40px 52px;display:grid;grid-template-columns:1fr 360px;gap:48px;align-items:start;max-width:100%}
.hero-inner{max-width:var(--max-w);margin:0 auto;width:100%;display:grid;grid-template-columns:1fr 360px;gap:48px;align-items:start}
.hero-eyebrow{display:inline-block;background:var(--orange);color:#111;font-size:11px;font-weight:700;padding:3px 10px;border-radius:2px;margin-bottom:12px;letter-spacing:.5px}
.hero h1{color:#fff;font-size:32px;font-weight:700;line-height:1.25;margin-bottom:16px}
.hero-desc{color:#99aabb;font-size:15px;line-height:1.8;margin-bottom:28px;max-width:540px}
.dual-cta{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.btn-primary{display:inline-block;background:var(--orange);color:#111;font-size:14px;font-weight:700;padding:11px 24px;border-radius:4px;border:none;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:var(--orange-dark)}
.btn-secondary{display:inline-block;background:transparent;color:var(--orange);border:1.5px solid var(--orange);font-size:13px;font-weight:600;padding:9px 20px;border-radius:4px;transition:all .15s}
.btn-secondary:hover{background:rgba(255,153,0,.1)}
.hero-footnote{color:#667788;font-size:11px;margin-top:8px}
/* Hero stat cards */
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:16px 18px}
.stat-num{font-size:24px;font-weight:800;color:var(--orange)}
.stat-label{font-size:11px;color:#8899aa;margin-top:3px}
/* ── Notice banner ───────────────────────────────────────────────── */
.notice{background:#FFF8E7;border-left:4px solid var(--orange);padding:14px 40px;font-size:13px;color:#333;line-height:1.7}
.notice strong{color:#b35000}
/* ── Section commons ─────────────────────────────────────────────── */
.section{padding:56px 40px}
.section-inner{max-width:var(--max-w);margin:0 auto}
.section.bg-light{background:var(--horizon)}
.section-label{font-size:11px;font-weight:700;color:var(--orange);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.section h2{font-size:26px;font-weight:700;margin-bottom:8px;color:var(--squid-ink)}
.section-intro{font-size:15px;color:var(--storm);max-width:680px;margin-bottom:36px;line-height:1.8}
/* ── Tile grid ───────────────────────────────────────────────────── */
.tile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile-wrap{background:#fff;border:1.5px solid #d5e3f0;border-radius:10px;padding:24px 20px;transition:box-shadow .2s,border-color .2s;position:relative}
.tile-wrap:hover{box-shadow:0 4px 20px rgba(0,0,0,.09);border-color:var(--aqua)}
.tile-wrap.jp-only{border-color:#f0c040;background:#fffdf5}
.tile-icon{font-size:28px;margin-bottom:12px}
.tile-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;margin-bottom:10px}
.tag-new{background:#e5f4e8;color:#1a7a30}
.tag-enhanced{background:#e8effe;color:#1a56cc}
.tag-jp{background:#fff3cd;color:#7a5a00}
.tile-wrap h3{font-size:14px;font-weight:700;margin-bottom:8px;line-height:1.4}
.tile-wrap p{font-size:13px;color:var(--storm);line-height:1.7}
.tile-val{font-size:22px;font-weight:800;color:var(--orange);margin:6px 0 4px}
.jp-badge{position:absolute;top:12px;right:12px;background:var(--orange);color:#111;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
/* ── Steps ───────────────────────────────────────────────────────── */
.steps-wrap{display:flex;flex-direction:column;gap:0;max-width:760px}
.step-row{display:flex;gap:24px;padding:24px 0;border-bottom:1px solid #e5e8ec;align-items:flex-start}
.step-row:last-child{border-bottom:none}
.step-num{min-width:42px;height:42px;background:var(--orange);color:#111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0}
.step-body h3{font-size:16px;font-weight:700;margin-bottom:5px}
.step-body p{font-size:14px;color:var(--storm)}
.step-alert{background:#FFF8E7;border:1px solid #FFD966;border-radius:5px;padding:10px 14px;margin-top:10px;font-size:13px;color:#333}
/* ── Comparison table ────────────────────────────────────────────── */
.compare-table{width:100%;border-collapse:collapse;font-size:14px}
.compare-table thead tr{background:var(--squid-ink);color:#fff}
.compare-table th{padding:13px 18px;text-align:left;font-weight:600}
.compare-table th:first-child{width:200px}
.compare-table td{padding:12px 18px;border-bottom:1px solid #e8eaed;vertical-align:top}
.compare-table tr:nth-child(even) td{background:#f8f9fa}
.compare-table td:first-child{font-weight:600;color:var(--squid-ink)}
.old-val{color:#999}
.new-val{color:var(--green);font-weight:600}
.arrow-col{color:var(--orange);font-size:16px;font-weight:700;text-align:center;width:36px}
/* ── Footer CTA ──────────────────────────────────────────────────── */
.footer-cta{background:var(--squid-ink);color:#fff;padding:52px 40px;text-align:center}
.footer-cta h2{font-size:26px;font-weight:700;margin-bottom:10px}
.footer-cta p{color:#8a9ab0;font-size:14px;margin-bottom:24px}
.footer-cta .footnote{color:#556677;font-size:11px;margin-top:14px}
/* ── Footer nav ──────────────────────────────────────────────────── */
footer{background:#131A22;padding:24px 40px;display:flex;align-items:center;justify-content:space-between}
footer .foot-links{display:flex;gap:20px}
footer a{color:#8a9ab0;font-size:12px}
footer a:hover{color:#fff}
footer .copy{color:#556;font-size:12px}
/* ── Responsive ──────────────────────────────────────────────────── */
@media(max-width:1000px){
  .hero-inner{grid-template-columns:1fr}
  .hero-stats{display:none}
  .tile-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  .tile-grid{grid-template-columns:1fr}
  .section,.hero{padding:40px 20px}
  nav,.breadcrumb,.swb,.lang-bar,.notice,.footer-cta,footer{padding-left:20px;padding-right:20px}
}
</style>
</head>

function setLang(lang) {
  // Update buttons
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
  document.documentElement.lang = lang === 'jp' ? 'ja' : lang === 'cn' ? 'zh' : 'en';

  // Apply all strings
  const s = STRINGS[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (s[key] !== undefined) el.textContent = s[key];
  });

  // PSA tile: show/hide JP badge only when in JP mode
  const tile = document.getElementById('tile-psa');
  if (tile) {
    tile.style.opacity = '1';
    tile.style.border = lang === 'jp' ? '1.5px solid #f0c040' : '1.5px solid #d5e3f0';
    tile.style.background = lang === 'jp' ? '#fffdf5' : '#fff';
  }

  // Nav logo text
  const logoTexts = { jp: 'amazon <span style="color:var(--orange)">出品サービス</span>', en: 'amazon <span style="color:var(--orange)">seller services</span>', cn: 'amazon <span style="color:var(--orange)">卖家服务</span>' };
  const logo = document.querySelector('.nav-logo-text');
  if (logo) logo.innerHTML = logoTexts[lang];
}
